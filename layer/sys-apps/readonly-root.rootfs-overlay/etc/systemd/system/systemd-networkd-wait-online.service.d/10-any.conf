# netgen (layer rpi/device/family-base) writes one DHCP=yes .network per
# interface with no RequiredForOnline=, so every managed link - including a
# wlan0 that is never associated to an AP on a wired appliance - counts as
# required-for-online. systemd-networkd-wait-online then blocks on wlan0
# until its timeout and exits 1, which both shows up as a failed unit and,
# because anything ordered After=network-online.target (e.g. homegear.service)
# waits on it, stalls that start by ~2 minutes on every boot.
#
# --any: online as soon as ANY managed link is routable. Right for an
# appliance that has eth0 or wlan0 (or both) - a genuinely disconnected
# box still (correctly) times out.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any

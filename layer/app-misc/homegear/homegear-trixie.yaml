# METABEGIN
# X-Env-Layer-Name: homegear-debian-trixie
# X-Env-Layer-Category: home-automation
# X-Env-Layer-Desc: Homegear home-automation platform for Debian Trixie,
#  ported from a custom pi-gen stage7. Registers the apt.homegear.eu repo
#  and creates the homegear system user at build time; the (large) package
#  set is installed interactively at the first login (console or SSH),
#  once /data is mounted, matching Homegear's own postinst behaviour of
#  detecting a pre-existing /data/homegear-data directory - and matching
#  pi-gen, which likewise ran its install from a login shell behind a
#  dialog progress box. The install cannot be started twice: the login
#  front end (/usr/sbin/homegear-firstboot) only ever starts
#  rpi-firstboot-homegear.service, and a concurrent login attaches to
#  that unit's progress instead of starting a second apt-get. Note the
#  consequence: an image that is never logged into never installs
#  Homegear (and, since layer firstboot-assistant waits for it, never
#  finalizes first boot either).
#  Database, logs and temp files are kept on a zram-backed
#  /var/lib/homegear/db (via layer setup-tmpfs's
#  extra-device mechanism); persistent config/state lives on /data (see
#  layer data-partition).
#
#  CAVEAT: apt.homegear.eu may not (yet) publish a trixie suite - verify
#  https://apt.homegear.eu/debian/trixie/homegear/stable/ resolves before
#  building. If not, point Suites: in
#  templates/debian/apt/homegear-trixie.sources at bookworm as an interim
#  measure; Homegear's own .debs are typically suite-agnostic.
# X-Env-Layer-Version: 1.2.0
# X-Env-Layer-Requires: setup-tmpfs,data-partition
#
# X-Env-VarRequires: IGconf_sys_apt_keydir
# X-Env-VarRequires-Valid: string
# METAEND
---
mmdebstrap:
  architectures:
    - arm64
  packages:
    # Progress boxes for the interactive first-boot install, as in pi-gen.
    - dialog
  mirrors:
    - ${IGTOP}/templates/debian/apt/homegear-trixie.sources
  setup-hooks:
    - mkdir -p $1/usr/share/keyrings/
    - curl -fsSL https://apt.homegear.eu/Release.key | gpg --dearmor -o $1/usr/share/keyrings/homegear-archive-keyring.gpg
    - chmod a+r $1/usr/share/keyrings/homegear-archive-keyring.gpg
    - cp -p $1/usr/share/keyrings/homegear-archive-keyring.gpg $IGconf_sys_apt_keydir
  customize-hooks:
    - |
      set -eu
      chroot "$1" sh -c '
        if ! id -u homegear >/dev/null 2>&1; then
          adduser --system --no-create-home --shell /bin/false --group homegear
        fi
        usermod -a -G dialout homegear 2>/dev/null || true
        usermod -a -G gpio homegear 2>/dev/null || true
        usermod -a -G spi homegear 2>/dev/null || true
      '
    - mkdir -p "$1/var/lib/homegear/db"
    - chroot "$1" chown -R homegear:homegear /var/lib/homegear
    # No enable-units for rpi-firstboot-homegear here, unlike the other
    # first-boot units in this image: it has no [Install] section on
    # purpose and is started on demand at login, not at boot. See the
    # unit file.

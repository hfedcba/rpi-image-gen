# METABEGIN
# X-Env-Layer-Name: openssh-server
# X-Env-Layer-Desc: OpenSSH server daemon and local user SSH key setup.
#  The host keys openssh-server's postinst generates inside the build
#  chroot are discarded, so every device gets its own on first boot
#  instead of the whole batch sharing the build host's key - see
#  regenerate_host_keys.
# X-Env-Layer-Version: 1.2.0
# X-Env-Layer-Requires: device-user-admin
#
# X-Env-VarPrefix: ssh
#
# X-Env-Var-pubkey_user1:
# X-Env-Var-pubkey_user1-Desc: Controls
#  /home/${IGconf_device_user1}/.ssh/authorized_keys
#  By default, authorized_keys will be created empty. If set to a valid file
#  path, the contents of the file is used to populate authorized_keys. If set to
#  a non-empty string that's not a valid file path, the contents of the variable
#  is used to populate authorized_keys.
#  Since it's possible to pass variables via the command line, one way to
#  specify this in build scripts could be as follows:
#  IGconf_ssh_pubkey_user1=$(< /path/to/.ssh/id_rsa.pub)
# X-Env-Var-pubkey_user1-Required: n
# X-Env-Var-pubkey_user1-Valid: string-or-empty
# X-Env-Var-pubkey_user1-Set: y
#
# X-Env-Var-pubkey_only: n
# X-Env-Var-pubkey_only-Desc: Applies sshd settings via /etc/ssh/sshd_config.d/
#  If n, default sshd settings are in place which means password authentication
#  is enabled.
#  If y, only SSH public key authentication is enabled. Challenge Response,
#  Password and Kerberos authentication are disabled. If alternative sshd
#  settings are required, consider using a device or image rootfs-overlay, or
#  custom bdebstrap hook.
# X-Env-Var-pubkey_only-Required: n
# X-Env-Var-pubkey_only-Valid: bool
# X-Env-Var-pubkey_only-Set: y
#
# X-Env-Var-regenerate_host_keys: y
# X-Env-Var-regenerate_host_keys-Desc: Remove the SSH host keys that
#  openssh-server's postinst generated inside the build chroot, so that
#  each device generates its own on first boot rather than every image
#  written from this build sharing one private key - which would make
#  host key verification meaningless and any device trivially
#  impersonatable by anyone holding the image.
#  No extra unit is needed for the regeneration: Debian's openssh-server
#  ships sshd-keygen.service (ConditionFirstBoot=yes, ExecStart=ssh-keygen
#  -A), already enabled via ssh.service.wants, and ssh-keygen -A creates
#  exactly the keys that are missing. It does need /etc to be writeable
#  at that point, which is the case even on read-only appliance images -
#  layer firstboot-assistant keeps root read-write for the whole of first
#  boot. Set to n only if you deliberately want a fixed, image-wide host
#  identity (e.g. a single-device build, or one where the keys are
#  provisioned by other means).
# X-Env-Var-regenerate_host_keys-Required: n
# X-Env-Var-regenerate_host_keys-Valid: bool
# X-Env-Var-regenerate_host_keys-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - openssh-server
  customize-hooks:
    - uchroot $1 'mkdir -m 0700 -p ${HOME}/.ssh'
    - uchroot $1 'install -m 0600 /dev/null ${HOME}/.ssh/authorized_keys'
    - |-
      set -u
      if [ -f "$IGconf_ssh_pubkey_user1" ] ; then
         cat "$IGconf_ssh_pubkey_user1" | uchroot $1 'cat > ${HOME}/.ssh/authorized_keys'
      elif [ -n "${IGconf_ssh_pubkey_user1:-}" ]; then
         uchroot $1 'echo "$IGconf_ssh_pubkey_user1" > ${HOME}/.ssh/authorized_keys'
      else
         echo "No SSH keys installed" >&2
      fi
    - |-
      if igconf isy ssh_pubkey_only ; then
         mkdir -p $1/etc/ssh/sshd_config.d
         cat <<- 'EOCHROOT' > $1/etc/ssh/sshd_config.d/01pubkey-only.conf
      PermitRootLogin no
      ChallengeResponseAuthentication no
      PasswordAuthentication no
      GSSAPIAuthentication no
      UsePAM yes
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      EOCHROOT
      fi
    - |-
      set -eu
      if igconf isy ssh_regenerate_host_keys ; then
         rm -f "$1"/etc/ssh/ssh_host_*_key "$1"/etc/ssh/ssh_host_*_key.pub
         # Debian's sshd-keygen.service gates on ConditionFirstBoot, i.e.
         # on /etc/machine-id still being empty. That holds for images
         # built here, but it is the wrong condition to bet the SSH
         # daemon on: if anything ever seeds machine-id at build time,
         # the unit would silently skip and sshd would come up with no
         # host keys at all - `sshd -t` fails, ssh.service never starts,
         # and a headless device is simply unreachable. Key on the thing
         # we actually care about instead.
         mkdir -p "$1/etc/systemd/system/sshd-keygen.service.d"
         cat <<- 'EOCHROOT' > "$1/etc/systemd/system/sshd-keygen.service.d/10-regenerate-if-missing.conf"
      [Unit]
      ConditionFirstBoot=
      ConditionPathExists=!/etc/ssh/ssh_host_ed25519_key
      EOCHROOT
      fi
    - $BDEBSTRAP_HOOKS/enable-units "$1" ssh
